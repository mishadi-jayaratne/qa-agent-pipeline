# QA Agent Pipeline — output configuration
#
# Controls where agents write generated artifacts, relative to the project root the
# pipeline is invoked from. Every agent reads this file first (see the "Output Location"
# section at the top of each prompt in prompts/) and falls back to these same defaults
# if this file is missing, so deleting it is safe — it just resets you to defaults.

output_dir: output
runs_subdir: runs
run_id: null   # unset -> agents default to today's date (YYYY-MM-DD); set explicitly (e.g. a
               # release tag or CR number) to keep concurrent cycles cleanly separated

# Optional inputs some agents look for. All may be left null and provided ad hoc by the user
# in conversation instead — these just save asking every time.
inputs:
  requirements_docs: null    # path/glob to SRS/CR doc(s), read by requirements-analyzer
  logs_dir: null              # default directory log-analyzer looks in if none specified
  bug_template: templates/bug-report.template.md
  regression_suite_manual: null     # path to a CSV export of the manual sanity/regression
                                     # suite (Excel/Sheets/TestRail/Xray export), read by
                                     # regression-inventory-analyzer
  regression_suite_automated: null  # path/glob to automated regression/sanity specs, in-repo
                                     # or an external local directory, read by
                                     # regression-inventory-analyzer

# GitLab project the gitlab-publisher agent files bugs/release notes against. Not a secret —
# the actual credential (GITLAB_PERSONAL_ACCESS_TOKEN) and instance URL (GITLAB_API_URL) are
# per-teammate values set in .env (see .env.example), never committed here.
gitlab:
  project: mishadij5/qa-agent-pipeline-test   # e.g. "group/subgroup/project" or the numeric project ID
  wiki_release_notes_dir: Version_History   # release notes wiki page: <this>/<version>-Release
  severity_labels: null       # optional map of template Severity values -> GitLab label names,
                               # e.g. {Critical: "severity::1", High: "severity::2"}. Leave null
                               # to have gitlab-publisher use your project's existing labels
                               # as-is and ask if a Severity value doesn't match one.

# File/folder names within a run. Rarely need to change these — mainly here so a team can
# rename to match existing conventions without editing every agent prompt. All paths below
# resolve under <output_dir>/<runs_subdir>/<run_id>/ EXCEPT `context`, `regression_inventory`
# (+ `regression_inventory_csv`), and `requirements`, which live directly under <output_dir>/ —
# refreshed in place across runs, not versioned per cycle. `rtm`/`rtm_csv` stay per-run: each
# run seeds its own RTM from whatever `requirements.md` looks like at that point.
paths:
  context: context.md
  regression_inventory: regression-inventory.md
  regression_inventory_csv: regression-inventory.csv
  requirements: requirements.md
  changes: changes.md
  rtm: rtm.md
  rtm_csv: rtm.csv
  code_scan: code-scan.md
  test_plan: test-plan.md
  test_plan_csv: test-plan.csv
  test_cases_dir: test-cases
  test_cases_csv: test-cases.csv
  coverage_matrix: coverage-matrix.md
  log_analysis: log-analysis.md
  rca_dir: rca
  bugs_dir: bugs
  test_closure_report: test-closure-report.md
  release_notes: release-notes.md
